[package]
name = "trax-core"
description = "Workspaces, collections, environments, storage and the request runner for http-trax"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
trax-script.workspace = true
base64.workspace = true
chrono.workspace = true
cookie_store.workspace = true
dirs.workspace = true
jsonschema.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

# OS keychain on Windows (Credential Manager) and macOS (Keychain). Linux goes
# through libsecret's `secret-tool`, so the headless build needs no D-Bus.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[dev-dependencies]
tempfile.workspace = true
wiremock = "0.6"
