[package]
name = "trax-cli"
description = "Command-line runner for http-trax collections, with JUnit, JSON and Markdown reports for CI"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "trax"
path = "src/main.rs"

[[bin]]
name = "courion-cli"
path = "src/bin/courion-cli.rs"

[dependencies]
trax-core.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
wiremock = "0.6"
