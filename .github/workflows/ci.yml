name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      # The root workspace's default members are the headless crates
      # (core, script, git, mcp); the Tauri app is checked in the app job.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  app:
    name: Desktop app (${{ matrix.name }})
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - name: Windows
            os: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: app

      - run: npm ci

      # Runs `npm run sidecar` (builds trax-mcp for bundling) and `npm run build`
      # (Next.js static export) via beforeBuildCommand, then bundles.
      - name: Build app and installers
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Clippy (Tauri app)
        if: runner.os == 'Linux'
        run: cargo clippy -p http-trax --all-targets -- -D warnings

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: http-trax-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

      - name: Upload standalone MCP server
        uses: actions/upload-artifact@v4
        with:
          name: trax-mcp-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/trax-mcp
            target/release/trax-mcp.exe

      - name: Build CLI
        run: cargo build --release -p trax-cli

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: trax-cli-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/trax
            target/release/trax.exe
